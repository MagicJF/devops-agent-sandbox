<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicio Operativo 2026</title>
<style>
  :root {
    color-scheme: light;
    --ok: #0a6b2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    color: #1b1f24;
    background: #f7f8fa;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 10px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 1.25rem;
    font-size: 1.75rem;
  }
  .banner {
    background: #e6ffe6;
    border: 1px solid #9fd89f;
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    font-weight: 600;
    color: var(--ok);
  }
  h2 {
    margin: 1.75rem 0 0.75rem;
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #5a6472;
  }
  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid #e3e6ea;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 0.25rem;
    border-bottom: 1px solid #e3e6ea;
  }
  .estado {
    font-weight: 700;
    color: var(--ok);
  }
  .estado::before {
    content: "\25CF";
    margin-right: 0.4rem;
    font-size: 0.7em;
    vertical-align: 0.15em;
  }
</style>
</head>
<body>
<main>
  <h1>Servicio Operativo 2026</h1>

  <p class="banner">Estado: Sistemas Operativos</p>

  <h2>Componentes</h2>
  <ul>
    <li><span>API</span><span class="estado">OK</span></li>
    <li><span>Base de Datos</span><span class="estado">OK</span></li>
    <li><span>Autenticación</span><span class="estado">OK</span></li>
  </ul>
</main>
</body>
</html>
